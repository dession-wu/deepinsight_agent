services:
  deepinsight-agent:
    build: .
    container_name: deepinsight-agent
    restart: unless-stopped
    ports:
      - "8085:8085"
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8085/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s